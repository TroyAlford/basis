name: 'Knip Dead-Code Check'
description: 'Run the Basis-owned knip dead-code analysis against a repository'

inputs:
  config:
    description: >-
      Path to a repository-specific knip config, relative to the working
      directory. When empty, a repository-local knip config is used if present;
      otherwise the shared Basis config bundled with this action.
    required: false
    default: ''
  args:
    description: 'Additional space-separated arguments passed to knip.'
    required: false
    default: ''
  version:
    description: 'knip version to run. Pinned by Basis so consumers do not track it.'
    required: false
    default: '6.37.0'
  working-directory:
    description: 'Directory to analyze, relative to the repository root.'
    required: false
    default: '.'
  fail-on-findings:
    description: >-
      When `true`, findings fail the job. Set to `false` for an advisory rollout
      before promoting the check to required. Advisory mode still fails on a knip
      configuration/input error (exit code 2).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Run knip
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        KNIP_VERSION: ${{ inputs.version }}
        KNIP_CONFIG: ${{ inputs.config }}
        KNIP_ARGS: ${{ inputs.args }}
        KNIP_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        KNIP_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -uo pipefail

        args=(--no-progress)

        if [ -n "$KNIP_CONFIG" ]; then
          # An explicit config always wins.
          args+=(--config "$KNIP_CONFIG")
        else
          # Leave an existing repository config to knip's own discovery: it knows
          # every supported location (`knip.json`, `knip.jsonc`, `knip.ts`,
          # `knip.js`, `knip.config.ts`, `knip.config.js`, `.knip.json`,
          # `.knip.jsonc`, and `package.json#knip`). Only fall back to the shared
          # Basis default when the repository has none, so passing `--config`
          # never silently overrides a legitimate repo config.
          repo_config=false
          for candidate in knip.json knip.jsonc knip.ts knip.js knip.config.ts knip.config.js .knip.json .knip.jsonc; do
            if [ -f "$candidate" ]; then
              repo_config=true
              break
            fi
          done
          if [ "$repo_config" != true ] && [ -f package.json ]; then
            if [ "$(bun -e 'console.log("knip" in require("./package.json"))' 2>/dev/null)" = 'true' ]; then
              repo_config=true
            fi
          fi
          if [ "$repo_config" != true ]; then
            args+=(--config "$KNIP_ACTION_PATH/knip.json")
          fi
        fi

        # Advisory mode suppresses the findings exit (1) with knip's own flag,
        # while exit 2 (configuration/input/internal failure) stays fatal.
        if [ "$KNIP_FAIL_ON_FINDINGS" != 'true' ]; then
          echo "::notice title=Basis knip::Advisory mode: findings are reported but will not fail this job."
          args+=(--no-exit-code)
        fi

        if [ -n "$KNIP_ARGS" ]; then
          # Deliberate word-splitting: `args` is a space-separated argument list.
          # shellcheck disable=SC2206
          extra=($KNIP_ARGS)
          args+=("${extra[@]}")
        fi

        echo "Running knip@${KNIP_VERSION}: knip-bun ${args[*]}"
        bunx --package "knip@${KNIP_VERSION}" knip-bun "${args[@]}"
        exit $?
