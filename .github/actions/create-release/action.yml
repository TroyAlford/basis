name: 'Create Release'
description: 'Creates a new release if needed based on conventional commits'

inputs:
  github-token:
    description: 'GitHub token for creating the release'
    required: true
  version:
    description: 'The version to release'
    required: true

outputs:
  current-version:
    description: 'The current version before any release'
    value: ${{ steps.release.outputs.current-version }}
  released:
    description: 'Whether a release was created'
    value: ${{ steps.release.outputs.release-needed }}
  version:
    description: 'The version that was released (or current version if no release created)'
    value: ${{ steps.release.outputs.next-version }}

runs:
  using: "composite"
  steps:
    - name: Create GitHub Release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        version="${{ inputs.version }}"
        gh release create "$version" \
          --title "$version" \
          --generate-notes
        echo "current-version=${version}" >> "$GITHUB_OUTPUT"
        echo "release-needed=true" >> "$GITHUB_OUTPUT"
        echo "next-version=${version}" >> "$GITHUB_OUTPUT"
