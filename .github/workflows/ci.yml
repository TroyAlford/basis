name: CI

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asdf-setup
      - name: Run ESLint
        run: NODE_NO_WARNINGS=1 bun ./node_modules/eslint/bin/eslint.js

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asdf-setup
      - run: bun test

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/asdf-setup
      - name: Run TypeScript Type Check
        run: bun run lint:ts

  consumer-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asdf-setup
      - name: Run consumer self-install contract
        run: bun run test:consumer

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asdf-setup
      # Exercises the action's exit-code and config-discovery behavior directly.
      - name: Knip action self-test
        run: bash .github/actions/knip/test.sh
      # Advisory while the repository baseline is established. Flip
      # `fail-on-findings` to `true` (or drop the input) to make it required.
      - name: Knip dead-code check
        uses: ./.github/actions/knip
        with:
          fail-on-findings: 'false'

  # publish-dry-run:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #       with: { fetch-depth: 0 }
  #     - uses: ./.github/actions/asdf-setup

  #     - name: Identify Changed Workspaces
  #       id: changes
  #       run: |
  #         changed=$(bun workspace changed)
  #         echo "Changed workspaces: $changed"
  #         echo "workspaces=$changed" >> $GITHUB_OUTPUT

  #     - name: Dry Run Publish Changed Workspaces
  #       if: steps.changes.outputs.workspaces != '[]'
  #       run: |
  #         workspaces='${{ steps.changes.outputs.workspaces }}'
  #         version='0.0.${{ github.run_number }}-alpha'

  #         for workspace in $(echo "$workspaces" | jq -r '.[]'); do
  #           echo "Dry run publishing $workspace@$version"
  #           bun ws publish --only "$workspace" --version "$version" --dryRun || {
  #             echo "::error::Failed to dry run publish $workspace"
  #             exit 1
  #           }
  #         done

  required:
    if: always()
    needs:
      - eslint
      - run-tests
      - type-check
      - knip
      - consumer-install
      # - publish-dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Check if required jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          else
            echo "All required jobs have passed or were skipped!"
          fi
