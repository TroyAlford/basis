name: CI

on:
  pull_request:
    types: [opened, synchronize, edited]
    branches: [main]

permissions:
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # `edited` runs must not cancel in-flight code runs (and vice versa), so the
  # action is part of the group.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  check-pr-title:
    # Check runs attach to a commit SHA, so a new commit needs its own title
    # check; the code gates below are what a title/body edit reuses instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/enforce-convco
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  eslint:
    # A title/body edit never reruns the code gates.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asdf-setup
      - name: Run ESLint
        run: NODE_NO_WARNINGS=1 bun ./node_modules/eslint/bin/eslint.js
      - name: Run Stylelint
        run: bun ./node_modules/stylelint/bin/stylelint.mjs "**/*.styles.ts" --config ./stylelint.config.mjs --allow-empty-input
      - name: Run Markdown lint
        run: bun run lint:md
      # `basis format` must apply every autofixable finding in one run; this
      # is the required gate that keeps the CLI's fix forwarding honest.
      - name: Verify lint autofix
        run: bun test consumer/cli.test.ts

  run-tests:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asdf-setup
      # The trusted install hook downloads the pinned Chromium browser but never
      # escalates privileges; CI provisions the OS libraries it needs explicitly.
      - name: Install Chromium system dependencies
        run: bunx playwright install-deps chromium
      - name: Run tests
        run: bun run test
      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '**/__screenshots__/**'
          if-no-files-found: ignore

  type-check:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/asdf-setup
      - name: Run TypeScript Type Check
        run: bun run lint:ts

  consumer-install:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asdf-setup
      - name: Run consumer self-install contract
        run: bun run test:consumer

  knip:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asdf-setup
      # Exercises the action's exit-code and config-discovery behavior directly.
      - name: Knip action self-test
        run: bash .github/actions/knip/test.sh
      # Advisory while the repository baseline is established. Flip
      # `fail-on-findings` to `true` (or drop the input) to make it required.
      - name: Knip dead-code check
        uses: ./.github/actions/knip
        with:
          fail-on-findings: 'false'

  # The single required status context. Every event posts it, so a title-only
  # edit cannot leave a stale red (or a stale green) behind: jobs that did not
  # run in this pass are resolved from their most recent completed check run on
  # the head SHA.
  required:
    if: always()
    needs:
      - check-pr-title
      - eslint
      - run-tests
      - type-check
      - knip
      - consumer-install
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job in this run did not pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' <<<"$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "Required jobs did not pass: ${failed//$'\n'/, }"
            exit 1
          fi
          echo "All jobs in this run passed or were intentionally skipped."

      - name: Wait for and reuse completed results for jobs this event skipped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          # A title/body edit can land while a code run for the same commit is
          # still in flight. Wait for it instead of failing on an empty result
          # set; a genuinely absent pass still fails once the wait elapses.
          REUSE_TIMEOUT_SECONDS: '2400'
          REUSE_POLL_SECONDS: '15'
        run: |
          set -euo pipefail

          # Latest conclusion of `job` from completed check runs on the head SHA
          # that do not belong to this run.
          latest_conclusion() {
            gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq "[.check_runs[]
                | select(.name == \"$1\")
                | select((((.details_url // \"\") | contains(\"/runs/${RUN_ID}/\")) | not))
                | select(.status == \"completed\")]
                | sort_by(.completed_at) | last | .conclusion // \"missing\""
          }

          # Number of check runs for `job` on the head SHA still in flight.
          pending_count() {
            gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq "[.check_runs[]
                | select(.name == \"$1\")
                | select((((.details_url // \"\") | contains(\"/runs/${RUN_ID}/\")) | not))
                | select(.status != \"completed\")] | length"
          }

          deadline=$(( SECONDS + REUSE_TIMEOUT_SECONDS ))
          skipped=$(jq -r 'to_entries[] | select(.value.result == "skipped") | .key' <<<"$NEEDS")
          for job in $skipped; do
            while [[ "$(pending_count "$job")" -gt 0 ]]; do
              if (( SECONDS >= deadline )); then
                echo "${job}: still in flight after ${REUSE_TIMEOUT_SECONDS}s; no result to reuse"
                exit 1
              fi
              echo "${job}: waiting for an in-flight run to finish"
              sleep "$REUSE_POLL_SECONDS"
            done
            conclusion=$(latest_conclusion "$job")
            case "$conclusion" in
              success|skipped|neutral) echo "${job}: reusing ${conclusion}" ;;
              *) echo "${job}: no current pass (${conclusion})"; exit 1 ;;
            esac
          done
