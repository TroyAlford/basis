name: Code CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # `epic/*` branches validate intermediate work under the same code checks
    # before their coordinated release PR targets `main`.
    branches: [main, 'epic/*']

permissions:
  contents: read

concurrency:
  # One group per workflow and pull request. A newer Code CI run supersedes an
  # unfinished earlier Code CI run; PR Metadata is a separate workflow and
  # never cancels code validation.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eslint:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run ESLint
        run: NODE_NO_WARNINGS=1 bun ./node_modules/eslint/bin/eslint.js
      - name: Run Stylelint
        run: bun ./node_modules/stylelint/bin/stylelint.mjs "**/*.styles.ts" --config ./stylelint.config.mjs --allow-empty-input
      - name: Run Markdown lint
        run: bun run lint:md

  impact:
    name: Impact
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}
      decision: ${{ steps.impact.outputs.decision }}
      decision-hash: ${{ steps.impact.outputs.decision-hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Start from the trusted base commit; the analyzer reads its policy
          # from the exact merge base, not from unreviewed PR changes.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch pull-request head and base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          test "$(git rev-parse refs/remotes/origin/pr-head)" = "$HEAD_SHA"
          git checkout --detach refs/remotes/origin/pr-head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Detect base impact policy
        id: policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          base=$(git rev-parse "origin/${BASE_REF}")
          echo "merge-base=$base" >> "$GITHUB_OUTPUT"
          if git cat-file -e "${base}:.github/ci-impact.json" 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify generated Graph snapshot
        run: bun run graph:check
      - name: Verify versioned database migrations
        run: bun run test:migrations -- --base origin/${{ github.event.pull_request.base.ref }}
      - name: Analyze change impact
        id: impact
        if: steps.policy.outputs.present == 'true'
        uses: TroyAlford/basis/.github/actions/change-impact@v7.11.0
        with:
          base-ref: origin/${{ github.event.pull_request.base.ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          config-path: .github/ci-impact.json
          output-file: impact-decision.json
      - name: Derive test-lane decisions
        id: lanes
        env:
          POLICY_PRESENT: ${{ steps.policy.outputs.present }}
        run: |
          set -euo pipefail
          lanes=(unit database e2e lifecycle docs)
          if [ "$POLICY_PRESENT" != "true" ]; then
            json='{}'
            for lane in "${lanes[@]}"; do
              json=$(jq -c --arg lane "$lane" '. + {($lane): true}' <<<"$json")
            done
            echo "lanes=$json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          json='{}'
          for lane in "${lanes[@]}"; do
            if jq -e --arg lane "$lane" '.suites | has($lane)' impact-decision.json >/dev/null; then
              value=$(jq -r --arg lane "$lane" '.suites[$lane].needed' impact-decision.json)
              if [ "$value" != "true" ] && [ "$value" != "false" ]; then
                echo "::error::Impact decision for lane '$lane' is not a boolean" >&2
                exit 1
              fi
            else
              # A lane added by this PR is absent from the trusted base policy.
              # Run it conservatively rather than silently skipping new coverage.
              echo "::notice::Base impact policy does not declare lane '$lane'; running it."
              value=true
            fi
            json=$(jq -c --arg lane "$lane" --argjson needed "$value" '. + {($lane): $needed}' <<<"$json")
          done
          echo "lanes=$json" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit and screenshots
    if: ${{ !github.event.pull_request.draft && (fromJSON(needs.impact.outputs.lanes).unit == true || fromJSON(needs.impact.outputs.lanes).docs == true) }}
    needs: [impact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch pull-request head and base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          test "$(git rev-parse refs/remotes/origin/pr-head)" = "$HEAD_SHA"
          git checkout --detach refs/remotes/origin/pr-head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Warm the Playwright container image
        if: ${{ fromJSON(needs.impact.outputs.lanes).unit == true }}
        run: |
          image="mcr.microsoft.com/playwright:v$(bun -e 'console.log(require("./node_modules/playwright/package.json").version)')-noble"
          docker pull "$image"
      - name: Run unit tests, screenshots and docs concurrently
        env:
          UNIT: ${{ fromJSON(needs.impact.outputs.lanes).unit }}
          DOCS: ${{ fromJSON(needs.impact.outputs.lanes).docs }}
        run: |
          set -uo pipefail
          pids=()
          launch() { "$@" & pids+=("$!"); }
          if [ "$UNIT" = "true" ]; then launch bun run test:unit; fi
          if [ "$DOCS" = "true" ]; then launch bun run docs:check; fi
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"

  database:
    name: Database
    if: ${{ !github.event.pull_request.draft && fromJSON(needs.impact.outputs.lanes).database == true }}
    needs: [impact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch pull-request head and base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          test "$(git rev-parse refs/remotes/origin/pr-head)" = "$HEAD_SHA"
          git checkout --detach refs/remotes/origin/pr-head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run one shared database suite
        env:
          BASIS_DATABASE_FIXTURE_EPHEMERAL: '1'
        run: |
          set -euo pipefail
          start=$(date +%s%3N)
          bun run test:database
          end=$(date +%s%3N)
          echo "Database lane wall clock: $((end - start)) ms" | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end
    if: ${{ !github.event.pull_request.draft && fromJSON(needs.impact.outputs.lanes).e2e == true }}
    needs: [impact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch pull-request head and base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          test "$(git rev-parse refs/remotes/origin/pr-head)" = "$HEAD_SHA"
          git checkout --detach refs/remotes/origin/pr-head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Warm the Playwright container image
        run: |
          image="mcr.microsoft.com/playwright:v$(bun -e 'console.log(require("./node_modules/playwright/package.json").version)')-noble"
          docker pull "$image"
      - name: Run browser end-to-end tests
        run: bun run test:e2e
      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '**/__screenshots__/**'
          if-no-files-found: ignore

  lifecycle:
    name: Lifecycle
    if: ${{ !github.event.pull_request.draft && fromJSON(needs.impact.outputs.lanes).lifecycle == true }}
    needs: [impact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch pull-request head and base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          test "$(git rev-parse refs/remotes/origin/pr-head)" = "$HEAD_SHA"
          git checkout --detach refs/remotes/origin/pr-head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Warm the Playwright container image
        run: |
          image="mcr.microsoft.com/playwright:v$(bun -e 'console.log(require("./node_modules/playwright/package.json").version)')-noble"
          docker pull "$image"
      - name: Run destructive and lifecycle proofs in parallel
        run: bun run test:lifecycle

  type-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run TypeScript Type Check
        run: bun run lint:ts

  consumer-install:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run consumer self-install contract
        run: bun run test:consumer

  knip:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Exercises the action's exit-code and config-discovery behavior directly.
      - name: Knip action self-test
        run: bash .github/actions/knip/test.sh
      # Advisory while the repository baseline is established. Flip
      # `fail-on-findings` to `true` (or drop the input) to make it required.
      - name: Knip dead-code check
        uses: ./.github/actions/knip
        with:
          fail-on-findings: 'false'

  # Code CI's only required status context. It judges the jobs in this same
  # workflow run and accepts a skipped suite only when the exact-run impact
  # decision marks that suite as not needed.
  required:
    name: required
    if: ${{ always() && !github.event.pull_request.draft }}
    needs:
      - eslint
      - impact
      - unit
      - database
      - e2e
      - lifecycle
      - type-check
      - knip
      - consumer-install
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected code job to succeed in this run
        env:
          NEEDS: ${{ toJSON(needs) }}
          LANES: ${{ needs.impact.outputs.lanes }}
          DECISION: ${{ needs.impact.outputs.decision }}
          DECISION_HASH: ${{ needs.impact.outputs.decision-hash }}
        run: |
          set -euo pipefail
          failed=0
          fail() { echo "::error::$*" >&2; failed=1; }
          result() { jq -r --arg job "$1" '.[$job].result // "missing"' <<<"$NEEDS"; }

          for job in eslint impact type-check knip consumer-install; do
            value=$(result "$job")
            if [[ "$value" != "success" ]]; then fail "$job ($value)"; fi
          done

          if [[ -z "${DECISION:-}" || -z "${DECISION_HASH:-}" ]]; then
            fail "impact decision or decision hash is missing"
          fi
          if ! jq -e 'type == "object"' <<<"${LANES:-null}" >/dev/null 2>&1; then
            fail "impact lane decision is missing or malformed"
            exit 1
          fi
          for lane in unit database e2e lifecycle docs; do
            needed=$(jq -r --arg lane "$lane" 'if has($lane) then .[$lane] else "missing" end' <<<"$LANES")
            if [[ "$needed" != "true" && "$needed" != "false" ]]; then
              fail "impact decision for lane '$lane' is missing or malformed"
            fi
          done

          check_group() {
            local job=$1
            shift
            local value
            value=$(result "$job")
            if [[ "$value" == "success" ]]; then return; fi
            if [[ "$value" != "skipped" ]]; then
              fail "$job ($value)"
              return
            fi
            for lane in "$@"; do
              local needed
              needed=$(jq -r --arg lane "$lane" 'if has($lane) then .[$lane] else "missing" end' <<<"$LANES")
              if [[ "$needed" == "true" ]]; then
                fail "$job was skipped but lane '$lane' was required"
              elif [[ "$needed" != "false" ]]; then
                fail "impact decision for lane '$lane' is missing or malformed"
              fi
            done
          }

          check_group unit unit docs
          check_group database database
          check_group e2e e2e
          check_group lifecycle lifecycle

          if [[ "$failed" -ne 0 ]]; then exit 1; fi
          echo "All selected required code jobs succeeded in this run."
