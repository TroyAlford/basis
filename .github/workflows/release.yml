name: Release

# Publishes a semantic-versioned GitHub release on every push to `main`, using
# the Basis release actions. It is also a reusable workflow, so any repository
# can publish the same way with a tiny caller:
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#       uses: TroyAlford/basis/.github/workflows/release.yml@<released-tag>
#
# Self-references to Basis's own actions use `@main` on purpose: pinning a
# self-reference to a tag is always one release behind the action it targets.

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:
  workflow_call:

permissions:
  # Least privilege: a caller that grants `contents: write` can call this
  # workflow. GITHUB_TOKEN permissions may only be downgraded by a called
  # workflow, so requesting more here than callers grant fails the run at
  # startup. (`id-token`/`packages` are only needed by the commented-out
  # publish job; re-enable them here and in callers together.)
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      release-needed: ${{ steps.version.outputs.release-needed }}
      next-version: ${{ steps.version.outputs.next-version }}
      current-version: ${{ steps.version.outputs.current-version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # The release job only needs `bun` (no dependencies), so install it
      # directly. This keeps the reusable workflow portable to consumers that
      # do not use ASDF.
      - name: Resolve pinned Bun version
        id: bun
        shell: bash
        run: echo "version=$(awk '$1 == "bun" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Determine Version
        id: version
        uses: TroyAlford/basis/.github/actions/determine-version@main

  create-release:
    needs: determine-version
    if: needs.determine-version.outputs.release-needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # `gh` is preinstalled on hosted runners. `github.token` is the caller's
      # token, which works for both this repository and reusable callers.
      - uses: TroyAlford/basis/.github/actions/create-release@main
        with:
          github-token: ${{ github.token }}
          version: ${{ needs.determine-version.outputs.next-version }}

