# Bun canary builds are distributed through npm but do not have a GitHub
# release asset. Use the real npm CLI so optional platform binaries install
# and Bun's postinstall can unpack the runtime.
[settings]
npm.package_manager = "npm"

[tools]
"npm:bun" = { version = "1.4.5-canary.20261121.1", allow_builds = true, npm_args = "--include=optional --ignore-scripts=false" }
